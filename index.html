<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ZimTrails — Explore Zimbabwe</title>
  <meta name="description" content="Discover tourism destinations and activities across Zimbabwe on one map.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
  <link rel="stylesheet" href="lib/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a href="#/" class="brand" aria-label="ZimTrails home">
        <svg class="brand-mark" viewBox="0 0 26 26" aria-hidden="true">
          <rect width="26" height="26" rx="5" fill="#1f4a34"/>
          <path d="M4 17l3-3 3 3 3-3 3 3 3-3 3 3" fill="none" stroke="#e7b36a" stroke-width="2" stroke-linejoin="round"/>
          <path d="M4 11l3-3 3 3 3-3 3 3 3-3 3 3" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" opacity=".9"/>
        </svg>
        ZimTrails
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">Menu</button>
      <nav class="nav" id="nav">
        <a href="#/" data-route="home">Home</a>
        <a href="#/explore" data-route="explore">Explore map</a>
        <a href="#/trip" data-route="trip">My trip <span class="count" id="tripCount">0</span></a>
        <a href="#/admin" data-route="admin">Operator portal</a>
      </nav>
    </div>
  </header>

  <main id="app"><div class="loading">Loading database…</div></main>

  <footer class="site-footer">
    <div class="wrap">
      <div>ZimTrails &middot; A tourism discovery platform for Zimbabwe</div>
      <div>Fees and prices are indicative. Confirm with ZimParks or the provider before travelling.</div>
    </div>
  </footer>

  <div id="modalRoot"></div>

  <script src="lib/sql-asm.js"></script>
  <script src="lib/leaflet/leaflet.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
